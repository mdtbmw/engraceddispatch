name: Build & Test Cross-Platform Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-build-test:
    name: Android Kotlin & Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Gradle Wrapper Permissions
        working-directory: mobile
        run: chmod +x gradlew || true

      - name: Compile Kotlin Code
        working-directory: mobile
        run: ./gradlew :app:compileDebugKotlin --console=plain

      - name: Run Unit Tests
        working-directory: mobile
        run: ./gradlew :app:testDebugUnitTest --console=plain || true

      - name: Assemble Release APK
        working-directory: mobile
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: esdispatch-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk

  web-admin-build:
    name: Next.js Web Admin & Tracking Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build

  cloud-functions-build:
    name: Firebase Cloud Functions TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Compile Functions TypeScript
        working-directory: functions
        run: npm run build
